AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Couch Game Studio on AWS: one Graviton EC2 instance with a fixed Elastic IP runs the Node
  studio server (TV app, phone app, WebSocket relay, Game Director on Bedrock Mantle) behind
  Caddy, which serves a permanent HTTPS address (<ip>.sslip.io) with an automatic Let's Encrypt
  certificate. Deploy with infra/aws/deploy.sh.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      Fire TV WebView needs a stable HTTPS URL baked into the Vega app, and phones join by
      QR code over the internet. A single small instance keeps cost low. CloudFront was the
      first choice but needs account verification by AWS Support; Caddy plus an sslip.io name
      for the Elastic IP gives a trusted certificate and WebSockets without a custom domain.
    must:
      - All regional resources stay in the project's selected Region (eu-north-1).
      - The Node server listens on 127.0.0.1 only; Caddy on 80/443 is the only public entry.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instance (the default VPC is fine).
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.micro, t4g.small]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  GitRef:
    Type: String
    Default: main
    Description: Branch or tag of the public repo to run.
  LlmProvider:
    Type: String
    Default: mantle
    AllowedValues: [auto, mantle, agent, converse, offline]
  BedrockDailyLimit:
    Type: Number
    Default: 150
    MinValue: 0
    Description: Bedrock designs per day before the offline designer takes over.

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Lets the server call Bedrock Mantle and be managed by Systems Manager (no SSH).
        must:
          - No long-lived keys on the instance; credentials come from this role via IMDSv2.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess
      Policies:
        - PolicyName: studio
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:CallWithBearerToken
                Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: A public website for phones and TVs anywhere, so HTTPS (and HTTP for redirects and certificate checks) is open to everyone.
        must:
          - Only 80 and 443. The Node port is never exposed, and there is no SSH; admin access is through SSM Session Manager.
    Properties:
      GroupDescription: Couch Game Studio web server (HTTPS via Caddy)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS and WebSockets }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP redirect and ACME challenge }

  ElasticIP:
    Type: AWS::EC2::EIP
    Metadata:
      com.aws.cloudformation.Context:
        why: A fixed public address, so the sslip.io hostname (and the URL baked into the Fire TV app) survives instance stop/start and replacement.
    Properties:
      Domain: vpc

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Boots Amazon Linux 2023, installs Node 22 and Caddy (both checksum-verified), runs the
          studio as a hardened systemd service from the public repo, waits for the Elastic IP,
          and signals CloudFormation once https://<host>/healthz answers with a real certificate.
          Later code updates go through /usr/local/bin/cgs-update (infra/aws/update.sh).
        must:
          - IMDSv2 only.
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref ServerSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: couch-game-studio }]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -Eeuo pipefail
              exec > >(tee -a /var/log/cgs-bootstrap.log) 2>&1
              dnf install -y -q aws-cfn-bootstrap git
              signal() { /opt/aws/bin/cfn-signal -e "$1" -r "$2" '${WaitHandle}' || true; }
              trap 'signal 1 "bootstrap failed, see /var/log/cgs-bootstrap.log"' ERR

              # 1 GB swap: npm install and the agent are comfortable on a 1 GB instance with it.
              if [ ! -f /swapfile ]; then
                dd if=/dev/zero of=/swapfile bs=1M count=1024 status=none
                chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
                echo '/swapfile none swap sw 0 0' >> /etc/fstab
              fi

              # Node 22 from nodejs.org, checked against the published SHA-256.
              DIST=https://nodejs.org/dist/latest-v22.x
              curl -fsSL "$DIST/SHASUMS256.txt" -o /tmp/node.sums
              NODE_TAR=$(awk '/linux-arm64\.tar\.xz$/ {print $2}' /tmp/node.sums)
              curl -fsSL "$DIST/$NODE_TAR" -o "/tmp/$NODE_TAR"
              (cd /tmp && grep " $NODE_TAR\$" node.sums | sha256sum -c -)
              tar -xJf "/tmp/$NODE_TAR" -C /usr/local --strip-components=1

              id cgs >/dev/null 2>&1 || useradd --system --create-home --home-dir /opt/couch-game-studio --shell /sbin/nologin cgs
              install -d -o cgs -g cgs -m 750 /var/lib/couch-game-studio
              runuser -u cgs -- git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
              echo '${GitRef}' > /etc/couch-game-studio.ref

              umask 077
              cat > /etc/couch-game-studio.env <<ENV
              NODE_ENV=production
              PORT=8787
              HOST=127.0.0.1
              PUBLIC_URL=https://${Host}
              DATA_DIR=/var/lib/couch-game-studio
              AWS_REGION=${AWS::Region}
              TRUST_PROXY=1
              LLM_PROVIDER=${LlmProvider}
              LLM_TIMEOUT_MS=25000
              BEDROCK_DAILY_LIMIT=${BedrockDailyLimit}
              ENV
              umask 022

              cat > /etc/systemd/system/couch-game-studio.service <<'UNIT'
              [Unit]
              Description=Couch Game Studio
              After=network-online.target
              Wants=network-online.target

              [Service]
              User=cgs
              WorkingDirectory=/opt/couch-game-studio/app
              EnvironmentFile=/etc/couch-game-studio.env
              ExecStart=/usr/local/bin/node server/index.js
              Restart=always
              RestartSec=2
              NoNewPrivileges=true
              ProtectSystem=strict
              ProtectHome=true
              ReadWritePaths=/var/lib/couch-game-studio
              PrivateTmp=true
              ProtectKernelTunables=true
              ProtectControlGroups=true
              RestrictSUIDSGID=true
              LimitNOFILE=65536

              [Install]
              WantedBy=multi-user.target
              UNIT

              cat > /usr/local/bin/cgs-update <<'UPDATE'
              #!/bin/bash
              # Fetch a branch or tag of the studio, install dependencies, restart, wait for health.
              set -euo pipefail
              REF=${!1:-$(cat /etc/couch-game-studio.ref)}
              APP=/opt/couch-game-studio/app
              as_cgs() { runuser -u cgs -- env HOME=/opt/couch-game-studio "$@"; }
              [ -d "$APP/.git" ] || as_cgs git clone --quiet https://github.com/priteshvirat24/couch-game-studio.git "$APP"
              cd "$APP"
              as_cgs git fetch --quiet --depth 1 origin "$REF"
              as_cgs git reset --quiet --hard FETCH_HEAD
              as_cgs /usr/local/bin/npm ci --omit=dev --no-audit --no-fund --loglevel=error
              echo "$REF" > /etc/couch-game-studio.ref
              systemctl restart couch-game-studio
              for i in $(seq 1 60); do
                if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then echo "studio up at $(as_cgs git rev-parse --short HEAD)"; exit 0; fi
                sleep 1
              done
              journalctl -u couch-game-studio -n 50 --no-pager
              exit 1
              UPDATE
              chmod 755 /usr/local/bin/cgs-update

              systemctl daemon-reload
              systemctl enable couch-game-studio
              /usr/local/bin/cgs-update '${GitRef}'

              # Caddy terminates TLS for ${Host}. Wait until the Elastic IP is ours first, so the
              # certificate authority's check reaches this instance.
              imds() { local t; t=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60'); curl -fsS -H "X-aws-ec2-metadata-token: $t" "http://169.254.169.254/latest/meta-data/$1"; }
              for i in $(seq 1 120); do [ "$(imds public-ipv4 || true)" = '${ElasticIP}' ] && break; sleep 5; done

              CADDY=2.11.7
              CADDY_TAR=caddy_${!CADDY}_linux_arm64.tar.gz
              curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v$CADDY/$CADDY_TAR" -o "/tmp/$CADDY_TAR"
              curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v$CADDY/caddy_${!CADDY}_checksums.txt" -o /tmp/caddy.sums
              (cd /tmp && grep " $CADDY_TAR\$" caddy.sums | sha512sum -c -)
              tar -xzf "/tmp/$CADDY_TAR" -C /usr/local/bin caddy
              id caddy >/dev/null 2>&1 || useradd --system --home-dir /var/lib/caddy --shell /sbin/nologin caddy
              install -d -o caddy -g caddy -m 700 /var/lib/caddy
              install -d -m 755 /etc/caddy
              cat > /etc/caddy/Caddyfile <<'CADDYFILE'
              ${Host} {
              	encode zstd gzip
              	header Strict-Transport-Security "max-age=31536000"
              	reverse_proxy 127.0.0.1:8787
              }
              CADDYFILE
              cat > /etc/systemd/system/caddy.service <<'UNIT'
              [Unit]
              Description=Caddy (HTTPS for Couch Game Studio)
              After=network-online.target
              Wants=network-online.target

              [Service]
              User=caddy
              Environment=XDG_DATA_HOME=/var/lib/caddy XDG_CONFIG_HOME=/var/lib/caddy
              ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
              ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile
              Restart=always
              AmbientCapabilities=CAP_NET_BIND_SERVICE
              CapabilityBoundingSet=CAP_NET_BIND_SERVICE
              NoNewPrivileges=true
              ProtectSystem=strict
              ProtectHome=true
              ReadWritePaths=/var/lib/caddy
              PrivateTmp=true
              LimitNOFILE=65536

              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now caddy

              # Done when the public HTTPS address answers with a trusted certificate.
              for i in $(seq 1 60); do
                if curl -fsS --max-time 10 https://${Host}/healthz >/dev/null; then signal 0 "https://${Host} is up"; exit 0; fi
                sleep 5
              done
              journalctl -u caddy -n 40 --no-pager
              signal 1 "HTTPS did not come up for ${Host}"
            - Host: !Join ['', [!Join ['-', !Split ['.', !Ref ElasticIP]], '.sslip.io']]

  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  Instance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Runs the studio. Games, drawings and scores live on its encrypted root volume under /var/lib/couch-game-studio.
        must:
          - Replacing the instance starts with an empty arcade (starter games only); back up /var/lib/couch-game-studio first.
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

  ElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      InstanceId: !Ref Instance

  Ready:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: ElasticIPAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: The stack only succeeds once the studio answers over HTTPS on its public address.
    Properties:
      Handle: !Ref WaitHandle
      Count: 1
      Timeout: '1800'

Outputs:
  StudioUrl:
    Description: Permanent HTTPS address. Put it in vega/src/config.ts.
    Value: !Join ['', ['https://', !Join ['-', !Split ['.', !Ref ElasticIP]], '.sslip.io']]
  TvUrl:
    Value: !Join ['', ['https://', !Join ['-', !Split ['.', !Ref ElasticIP]], '.sslip.io/tv/']]
  InstanceId:
    Description: For SSM Session Manager and infra/aws/update.sh.
    Value: !Ref Instance
