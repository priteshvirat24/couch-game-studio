name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t couch-game-studio .
      - name: Smoke test the image
        run: |
          docker run -d --name cgs -p 8787:8787 -e LLM_PROVIDER=offline couch-game-studio
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/games | grep -q seed-taco
  vega:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vega/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx jest --silent
